name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first — this repo's suite is
# fast and there is no value in finishing a run for a superseded commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: orchestrator/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # No secrets, no network, no credentials. `vitest.config.ts` supplies
      # deliberately-implausible placeholder values for every infrastructure
      # variable, so a test can neither reach a real account nor pass because
      # someone happened to have their own credentials in the environment.
      - name: Test
        run: npm test

  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Each target's suite runs with no network, no credentials and no cloud
      # account, which is the property that makes it runnable here at all.
      # They are plain node scripts with no dependencies, so there is nothing
      # to install.
      - name: Cloudflare target
        run: ./targets/cloudflare/test/run-all.sh

      - name: Local target
        run: ./targets/local/test/run-all.sh

      # A shell script that does not parse is a deploy that fails at the worst
      # possible moment. `bash -n` is free and catches it here.
      #
      # ⚠️ Ubuntu ships bash 5; macOS ships bash 3.2, and 3.2 mis-parses a
      # single quote inside ${VAR:?...} EVEN INSIDE double quotes — reporting
      # the error ~45 lines from its cause. That bug shipped in run-batch.sh
      # and was caught by hand, not here, so CI cannot claim to cover it.
      - name: Shell scripts parse
        run: |
          for f in targets/*/*.sh targets/*/test/*.sh docs/open-web-vectors/*.sh; do
            [ -e "$f" ] || continue
            bash -n "$f" || { echo "::error file=$f::does not parse"; exit 1; }
          done

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These are the mistakes that made this repo an extraction rather than a
      # visibility flip. The unit suite covers infra fallbacks inside src/;
      # this covers the files it cannot reach — plists, shell scripts, docs —
      # and it is deliberately a separate job so a hygiene failure is not
      # buried in a test log.
      - name: No developer-local absolute paths
        run: |
          if git grep -nE '/Users/[a-z]+' -- . ':!*.test.ts' ':!.github/**'; then
            echo "::error::a developer-local path is committed — derive it from the repo root or an env var"
            exit 1
          fi

      - name: No account-specific infrastructure identifiers
        run: |
          # A default naming real infrastructure does not fail loudly when it is
          # wrong; it succeeds against somebody else's account.
          # No exclusion list on purpose. The test placeholders in
          # vitest.config.ts are deliberately NOT identifier-shaped, so this
          # pattern stays simple and nothing has to be carved out of it —
          # a carve-out is where the next real identifier would hide.
          if git grep -nE 'openai-api-4375643|pub-[0-9a-f]{32}\.r2\.dev|[0-9a-f]{32}' \
               -- . ':!package-lock.json' ':!.github/**' ':!docs/open-web-vectors/*.png'; then
            echo "::error::an account-specific identifier is committed — route it through requireEnv"
            exit 1
          fi

      - name: No account-specific identifiers in targets/
        run: |
          # The Cloudflare target's extraction introduced three identifier
          # shapes the sweep above cannot see: a Turso organisation slug, a
          # *.workers.dev subdomain, and a 24-hex Mongo ObjectId (the
          # whitelabel) — which is SHORTER than the 32-hex pattern and so slips
          # straight through it.
          #
          # ⚠️ SCOPED TO targets/ ON PURPOSE, and this is accepted debt rather
          # than a clean bill of health. `orchestrator/` carries PRE-EXISTING
          # occurrences of the originating account's real subdomain
          # (divinci-ai.workers.dev, in 6 files) and of real prospect slugs in
          # fixtures and migration scripts. Those predate this job, need their
          # own change to clean up, and must not be silently normalised by a
          # regex here. Widening this scope without fixing them first would
          # only teach people to delete the check.
          if git grep -nE '[a-z0-9-]+\.workers\.dev|"TURSO_ORG"[[:space:]]*:[[:space:]]*"[^"]{1,}"|"WHITELABEL_ID"[[:space:]]*:[[:space:]]*"[0-9a-f]{24}"' \
               -- targets/ ':!targets/*/README.md' ':!targets/cloudflare/run-batch.sh'; then
            echo "::error::an account-specific identifier is committed under targets/ — make it a required env var with no default"
            exit 1
          fi

      - name: No internal hostnames
        run: |
          # This class was missed twice. The first sweep looked for
          # `process.env.X ?? "literal"` in TypeScript, so it could not see a
          # hardcoded constant in a Python script, and it did not look at prose
          # at all — the README and docs/LOOP.md both went on documenting one
          # deployment's internal host as "the default, no configuration
          # needed" for a whole release cycle.
          #
          # A grep over every tracked file, in any language, is the only form
          # of this check that holds. divinci.app is the PUBLIC product API and
          # is deliberately allowed.
          if git grep -nE 'review-board-acme|demo-hooks\.divinci\.net' -- . ':!.github/**'; then
            echo "::error::an internal hostname is committed — read it from an env var with no default"
            exit 1
          fi

      - name: No run data beyond the synthetic fixture
        run: |
          # runs/ holds real companies' crawled corpora and outreach drafts.
          # Committing it is what forced this repository to be re-created from
          # scratch; the .gitignore prevents it and this proves the .gitignore.
          unexpected="$(git ls-files runs/ | grep -v '^runs/__smoke__/' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::run data is tracked:"; echo "$unexpected"; exit 1
          fi
